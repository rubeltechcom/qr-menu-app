<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <!--
    The app logo as Google's OAuth consent screen shows it.

    Same mark as icon.svg, simplified for size. That icon is drawn for
    512px and carries fifteen small data squares; at the 120px Google
    asks for, and smaller again in the consent dialog itself, they merge
    into a grey smudge. This keeps the three corner finders — which are
    what make a QR code readable as a QR code — and thins the data
    squares to six larger ones, so the silhouette survives being shown
    at 48px in a browser tab or a permissions list.
  -->
  <rect width="512" height="512" rx="102.4" fill="#18181b"/>

  <!-- Corner finders, thicker-stroked than the 512px version. -->
  <rect x="76" y="76" width="118" height="118" rx="26" fill="none" stroke="#ffffff" stroke-width="34"/>
  <rect x="318" y="76" width="118" height="118" rx="26" fill="none" stroke="#ffffff" stroke-width="34"/>
  <rect x="76" y="318" width="118" height="118" rx="26" fill="none" stroke="#ffffff" stroke-width="34"/>

  <!-- Finder centres. -->
  <rect x="118" y="118" width="34" height="34" rx="9" fill="#ffffff"/>
  <rect x="360" y="118" width="34" height="34" rx="9" fill="#ffffff"/>
  <rect x="118" y="360" width="34" height="34" rx="9" fill="#ffffff"/>

  <!-- Data squares: fewer and larger than the full icon's. -->
  <rect x="240" y="86" width="44" height="44" rx="11" fill="#ffffff"/>
  <rect x="240" y="170" width="44" height="44" rx="11" fill="#ffffff"/>
  <rect x="240" y="254" width="44" height="44" rx="11" fill="#ffffff"/>
  <rect x="324" y="254" width="44" height="44" rx="11" fill="#ffffff"/>
  <rect x="324" y="338" width="44" height="44" rx="11" fill="#ffffff"/>
  <rect x="240" y="380" width="44" height="44" rx="11" fill="#ffffff"/>
  <rect x="380" y="380" width="44" height="44" rx="11" fill="#ffffff"/>
</svg>
